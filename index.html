<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Urna Fictícia</title>
<style>
:root{--bg:#eceff2;--fg:#1d1d1d;--card:#fff;--line:#d0d6dc;--muted:#6b7280;--ok:#1f7a3a;--bad:#b3261e;--btn:#2c3e50;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121417;--fg:#eceff3;--card:#1f2327;--line:#363c44;--muted:#9aa3ad;--btn:#3b4a5a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121417;--fg:#eceff3;--card:#1f2327;--line:#363c44;--muted:#9aa3ad;--btn:#3b4a5a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,sans-serif;min-height:100%;padding:env(safe-area-inset-top,0px) 14px env(safe-area-inset-bottom,0px)}
main{max-width:720px;margin:0 auto;padding:16px 0 40px}
h1{font-size:1.4rem;margin:8px 0}
h2{font-size:1.05rem;margin:14px 0 8px}
.aviso{background:#fff3cd;color:#5c4400;border-radius:8px;padding:8px 12px;font-size:.85rem;margin:8px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
label{display:block;font-size:.85rem;color:var(--muted);margin:8px 0 4px}
input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
.row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.row>*{flex:1 1 120px}
.row>.auto{flex:0 0 auto;width:auto}
button{background:var(--btn);color:#fff;border:0;border-radius:8px;padding:10px 14px;font:inherit;cursor:pointer}
button.sec{background:transparent;color:var(--fg);border:1px solid var(--line)}
button:disabled{opacity:.5;cursor:default}
.passos{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.passos span{font-size:.8rem;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.passos span.on{background:var(--btn);color:#fff;border-color:var(--btn)}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:12px}
.lista{list-style:none;padding:0;margin:0}
.lista li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.lista li:last-child{border-bottom:0}
.foto{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--line);flex:0 0 44px;display:flex;align-items:center;justify-content:center;font-weight:700}
.link{word-break:break-all;font-family:ui-monospace,monospace;background:var(--bg);padding:8px;border-radius:8px;font-size:.9rem}
.msg{padding:8px 12px;border-radius:8px;margin:8px 0;font-size:.9rem}
.msg.err{background:#fde7e5;color:var(--bad)}
.hidden{display:none!important}
small{color:var(--muted)}
.foto-btn{background:none;padding:0;border:0;cursor:pointer;color:inherit}
html{-webkit-text-size-adjust:100%}
img{max-width:100%;height:auto}
button{touch-action:manipulation}
h1{font-size:clamp(1.2rem,4.5vw,1.4rem)}
.lista li{flex-wrap:wrap}
.link{overflow-wrap:anywhere}
.urna{width:100%;max-width:420px;padding:clamp(10px,3vw,14px)}
.tela{min-height:clamp(150px,42vw,200px);padding:clamp(8px,2.5vw,12px)}
.tela .num{font-size:clamp(1.5rem,7vw,2.2rem)}
.tela .cand img{width:clamp(48px,14vw,72px);height:clamp(48px,14vw,72px)}
.teclado button{min-height:48px;font-size:clamp(1.05rem,4.5vw,1.3rem);padding:10px 0}
.teclado .branco,.teclado .corrige,.teclado .confirma{font-size:clamp(.72rem,3vw,.85rem)}
@media (max-width:480px){
  main{padding-top:10px}
  .row{flex-direction:column;align-items:stretch}
  .row>*,.row>.auto{flex:1 1 auto;width:100%}
  .nav{flex-direction:column}
  .nav button{width:100%}
  .passos span{font-size:.72rem;padding:3px 8px}
}
@media (min-width:481px) and (max-width:820px){ main{max-width:640px} }
.barra{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px}
.barra div{height:100%;background:var(--ok)}
/* urna em visual genérico: corpo claro, teclado escuro, botões coloridos */
.urna{background:#dfe3e8;border-radius:16px;padding:14px;max-width:420px;margin:0 auto;border:1px solid #c4cad2}
.urna .tela{background:#f7f9fb;color:#111;border:2px solid #aab3be;border-radius:8px;padding:12px;min-height:200px;font-family:ui-monospace,monospace}
.tela .lbl{font-size:.8rem;color:#555}
.tela .cargo{font-size:1rem;font-weight:700;margin-bottom:6px}
.tela .num{font-size:2.2rem;letter-spacing:.2em;min-height:2.6rem}
.tela .cand{display:flex;gap:12px;align-items:center;margin-top:8px}
.tela .cand img{width:72px;height:72px;border-radius:6px;object-fit:cover;background:#dde3ea}
.tela .nome{font-size:1.1rem}
.tela.flash{animation:fl .3s 3}
@keyframes fl{50%{background:#fff;color:#000}}
.teclado-wrap{background:#1f2327;border-radius:8px;padding:12px;margin-top:12px}
.teclado{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.teclado button{background:#2b3137;font-size:1.3rem;padding:14px 0;border-radius:6px}
.teclado .branco{background:#e9edf1;color:#111;font-size:.8rem}
.teclado .corrige{background:#d9822b;font-size:.8rem}
.teclado .confirma{background:#2e8b57;font-size:.8rem}
.teclado .cancelar{background:transparent;border:1px solid #555;font-size:.75rem}
</style>
</head>
<body>
<main>
  <div class="aviso"><strong>Eleição fictícia para brincadeira.</strong> Não tem nenhum valor oficial e não tem relação com a Justiça Eleitoral ou qualquer órgão real.</div>
  <div id="erro" class="msg err hidden"></div>
  <div id="app"></div>
</main>

const $ = (s) => document.querySelector(s);
window.addEventListener("error", (ev) => { const m = document.getElementById("erro"); if (m) { m.textContent = "Erro: " + ev.message; m.classList.remove("hidden"); } });
window.addEventListener("unhandledrejection", (ev) => { const m = document.getElementById("erro"); if (m) { m.textContent = "Erro: " + (ev.reason?.message || ev.reason); m.classList.remove("hidden"); } });
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const token = (n = 8) => { const a = "abcdefghjkmnpqrstuvwxyz23456789"; let s = ""; for (const x of crypto.getRandomValues(new Uint8Array(n))) s += a[x % a.length]; return s; };
const norm = (s) => String(s).trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
function erro(m) { const e = $("#erro"); e.textContent = m; e.classList.remove("hidden"); setTimeout(() => e.classList.add("hidden"), 4000); }
function setApp(html) { $("#app").innerHTML = html; }

/* Banco sobre a API REST do Supabase, com a mesma interface usada pela página. */
function criaBancoSupabase() {
  const H = { apikey: SUPABASE_ANON_KEY, "Content-Type": "application/json" };
  const base = SUPABASE_URL.replace(/\/$/, "") + "/rest/v1/documents";
  const q = (s) => encodeURIComponent(s);
  async function ler(path) {
    const r = await fetch(`${base}?path=eq.${q(path)}&select=data`, { headers: H });
    if (!r.ok) throw new Error("ler " + r.status);
    const rows = await r.json();
    return rows.length ? rows[0].data : null;
  }
  async function gravar(path, data) {
    const r = await fetch(base + "?on_conflict=path", { method: "POST", headers: { ...H, Prefer: "resolution=merge-duplicates" }, body: JSON.stringify({ path, data }) });
    if (!r.ok) throw new Error("gravar " + r.status);
  }
  async function apagar(path) {
    const r = await fetch(`${base}?path=eq.${q(path)}`, { method: "DELETE", headers: H });
    if (!r.ok) throw new Error("apagar " + r.status);
  }
  async function listar(prefixo, n) {
    const r = await fetch(`${base}?path=like.${q(prefixo)}*&select=data&limit=${n}`, { headers: H });
    if (!r.ok) throw new Error("listar " + r.status);
    return r.json();
  }
  function docRef(path) {
    return {
      get: async () => { const d = await ler(path); return { exists: d !== null, data: () => (d === null ? undefined : d) }; },
      set: (data) => gravar(path, data),
      update: async (data) => { const atual = await ler(path); if (atual === null) throw new Error("não existe"); await gravar(path, { ...atual, ...data }); },
      delete: () => apagar(path),
      collection: (nome) => colecao(path + "/" + nome),
    };
  }
  function colecao(path) {
    return {
      add: async (data) => { await gravar(path + "/" + token(12), data); },
      limit: (n) => ({ get: async () => { const rows = await listar(path + "/", n); return { docs: rows.map(r => ({ data: () => r.data })) }; } }),
    };
  }
  return { doc: (path) => docRef(path) };
}

async function initDb() {
  if (/^https?:\/\//.test(SUPABASE_URL)) { db = criaBancoSupabase(); return; }
  try { db = window.claude ? await window.claude.use("db") : null; } catch (e) { db = null; }
}

function normalizar(e) {
  if (Array.isArray(e.cargos) && e.cargos.length) return e;
  return { ...e, cargos: [{ nome: "Voto", candidatos: e.candidatos || [] }] };
}

async function sha256(s) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}
function urlBase() { const h = location.href.split("#")[0]; return /^https?:\/\//.test(h) ? h : ""; }
function formatar(ms) {
  if (!ms) return "—";
  return new Date(ms).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false });
}

function reduzirFoto(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, 96 / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL("image/jpeg", 0.6));
      };
      img.onerror = rej; img.src = r.result;
    };
    r.onerror = rej; r.readAsDataURL(file);
  });
}

      </div>
    </div>`);
  $("#btn_criar").onclick = () => { location.hash = "criar"; };
  $("#btn_abrir").onclick = () => {
    const v = $("#abrir_id").value.trim().replace(/^#/, "").replace(/-resultados$/, "");
    if (!v) return erro("Digite o código da eleição.");
    location.hash = v;
  };
}

/* ===================== criação em etapas ===================== */
const ETAPAS = [
  ["info", "1. Informações"],
  ["partidos", "2. Partidos"],
  ["cargos", "3. Cargos"],
  ["candidatos", "4. Candidatos"],
  ["revisar", "5. Revisar"],
];

function cabecalhoEtapas(rid, atual) {
  return `<h1>Nova eleição</h1>
    <div class="passos">${ETAPAS.map(([k, t]) => `<span class="${k === atual ? "on" : ""}">${t}</span>`).join("")}</div>`;
}
function navEtapas(rid, atual) {
  const i = ETAPAS.findIndex(([k]) => k === atual);
  const ant = i > 0 ? `#novo-${rid}-${ETAPAS[i - 1][0]}` : "#";
  const prox = i < ETAPAS.length - 1 ? `#novo-${rid}-${ETAPAS[i + 1][0]}` : null;
  return `<div class="nav">
    <button class="sec" id="nav_ant" ${i === 0 ? "disabled" : ""}>← Voltar</button>
    ${prox ? `<button id="nav_prox">Avançar →</button>` : ""}
  </div>`;
}
function ligarNav(rid, atual, antes) {
  const i = ETAPAS.findIndex(([k]) => k === atual);
  if ($("#nav_ant")) $("#nav_ant").onclick = () => { location.hash = `novo-${rid}-${ETAPAS[i - 1][0]}`; };
  if ($("#nav_prox")) $("#nav_prox").onclick = async () => {
    if (antes && !(await antes())) return;
    location.hash = `novo-${rid}-${ETAPAS[i + 1][0]}`;
  };
}

async function carregarRascunho(rid) {
  const s = await docRascunho(rid).get();
  return s.exists ? JSON.parse(JSON.stringify(s.data())) : null;
}
async function salvarRascunho(rid, dados) { await docRascunho(rid).set(dados); }

async function novoRascunho() {
  if (!db) return home();
  const rid = token(6);
  try {
    await docRascunho(rid).set({ titulo: "", descricao: "", partidos: [], cargos: [], candidatos: [] });
    location.hash = `novo-${rid}-info`;
  } catch (e) { erro("Não consegui iniciar a eleição. Verifique seu acesso."); home(); }
}

async function etapaCriacao(rid, etapa) {
  const d = await carregarRascunho(rid);
  if (!d) { erro("Rascunho não encontrado. Comece de novo."); return home(); }
  const telas = { info: telaInfo, partidos: telaPartidos, cargos: telaCargos, candidatos: telaCandidatos, revisar: telaRevisar };
  const fn = telas[etapa] || telaInfo;
  fn(rid, d, etapa);
}

function telaInfo(rid, d, etapa) {
  setApp(`${cabecalhoEtapas(rid, etapa)}
    <div class="card">
      <label>Título da eleição</label>
      <input id="titulo" maxlength="80" value="${esc(d.titulo)}" placeholder="Ex.: Eleições do Grupo de Amigos">
      <label>Descrição (opcional)</label>
      <input id="desc" maxlength="200" value="${esc(d.descricao)}" placeholder="Ex.: Escolha quem manda no churrasco">
    </div>
    ${navEtapas(rid, etapa)}`);
  ligarNav(rid, etapa, async () => {
    const titulo = $("#titulo").value.trim();
    if (!titulo) { erro("Dê um título para a eleição."); return false; }
    await salvarRascunho(rid, { ...d, titulo, descricao: $("#desc").value.trim() });
    return true;
  });
}

function telaPartidos(rid, d, etapa) {
  const lista = d.partidos.map((p, i) => `<li><span style="flex:1"><strong>${esc(p.sigla)}</strong> — ${esc(p.nome)}</span>
    <button class="sec auto" data-rm="${i}">Remover</button></li>`).join("") || `<li><small>Nenhum partido ainda.</small></li>`;
  setApp(`${cabecalhoEtapas(rid, etapa)}
    <div class="card">
      <h2>Partidos</h2>
      <div class="row">
        <div><label>Sigla</label><input id="p_sigla" maxlength="10" placeholder="PBZ"></div>
        <div><label>Nome</label><input id="p_nome" maxlength="50" placeholder="Partido da Buzina"></div>
        <button class="auto" id="p_add">Adicionar</button>
      </div>
      <ul class="lista" style="margin-top:10px">${lista}</ul>
    </div>
    ${navEtapas(rid, etapa)}`);
  $("#p_add").onclick = async () => {
    const sigla = $("#p_sigla").value.trim().toUpperCase(), nome = $("#p_nome").value.trim();
    if (!sigla || !nome) return erro("Preencha sigla e nome.");
    if (d.partidos.some(p => p.sigla === sigla)) return erro("Já existe partido com essa sigla.");
    d.partidos.push({ sigla, nome });
    telaPartidos(rid, d, etapa);
    try { await salvarRascunho(rid, d); }
    catch (e) { d.partidos.pop(); telaPartidos(rid, d, etapa); erro("Não consegui salvar o partido. Verifique seu acesso e tente de novo."); }
  };
  document.querySelectorAll("[data-rm]").forEach(b => b.onclick = async () => {
    const i = +b.dataset.rm;
    d.partidos.splice(i, 1);
    d.candidatos = d.candidatos.filter(c => c.partido !== i).map(c => ({ ...c, partido: c.partido > i ? c.partido - 1 : c.partido }));
    telaPartidos(rid, d, etapa);
    try { await salvarRascunho(rid, d); }
    catch (e) { erro("Não consegui salvar a remoção. Tente de novo."); }
  });
  ligarNav(rid, etapa, async () => {
    if (!d.partidos.length) { erro("Adicione pelo menos um partido."); return false; }
    return true;
  });
}

function telaCargos(rid, d, etapa) {
  const lista = d.cargos.map((g, i) => `<li><span style="flex:1"><strong>${esc(g.nome)}</strong></span>
    <button class="sec auto" data-rm="${i}">Remover</button></li>`).join("") || `<li><small>Nenhum cargo ainda.</small></li>`;
  setApp(`${cabecalhoEtapas(rid, etapa)}
    <div class="card">
      <h2>Cargos</h2>
      <p><small>Ex.: Presidente, Vice, Síndico. Cada cargo terá sua própria votação.</small></p>
      <div class="row">
        <div><label>Nome do cargo</label><input id="cg_nome" maxlength="40" placeholder="Presidente"></div>
        <button class="auto" id="cg_add">Adicionar</button>
      </div>

    </div>

    if (!nome) return erro("Dê um nome para o cargo.");
    if (d.cargos.some(g => norm(g.nome) === norm(nome))) return erro("Esse cargo já existe.");
    d.cargos.push({ nome });
    await salvarRascunho(rid, d); telaCargos(rid, d, etapa);
  };
  document.querySelectorAll("[data-rm]").forEach(b => b.onclick = async () => {
    const i = +b.dataset.rm;
    d.cargos.splice(i, 1);
    d.candidatos = d.candidatos.filter(c => c.cargo !== i).map(c => ({ ...c, cargo: c.cargo > i ? c.cargo - 1 : c.cargo }));
    await salvarRascunho(rid, d); telaCargos(rid, d, etapa);
  });
  ligarNav(rid, etapa, async () => {
    if (!d.cargos.length) { erro("Adicione pelo menos um cargo."); return false; }
    return true;
  });
}

function telaCandidatos(rid, d, etapa) {
  if (!d.partidos.length || !d.cargos.length) {
    setApp(`${cabecalhoEtapas(rid, etapa)}<div class="card"><p>Antes, cadastre partidos e cargos.</p></div>${navEtapas(rid, etapa)}`);
    ligarNav(rid, etapa); return;
  }
  const porCargo = d.cargos.map((g, gi) => {
    const cs = d.candidatos.map((c, ci) => ({ ...c, _i: ci })).filter(c => c.cargo === gi);
    return `<h2>${esc(g.nome)} <small>(${cs.length} candidato(s), mínimo 2)</small></h2>
      <ul class="lista">${cs.map(c => `<li>${c.foto ? `<img class="foto" src="${c.foto}" alt="">` : `<div class="foto">?</div>`}
        <span style="flex:1"><strong>nº ${esc(c.numero)}</strong> ${esc(c.nome)} <small>${esc(d.partidos[c.partido]?.sigla || "")}</small></span>
        <button class="sec auto" data-rm-c="${c._i}">Remover</button></li>`).join("") || `<li><small>Nenhum candidato.</small></li>`}</ul>`;
  }).join("");
  setApp(`${cabecalhoEtapas(rid, etapa)}
    <div class="card">
      <h2>Adicionar candidato</h2>
      <div class="row">
        <div><label>Cargo</label><select id="c_cargo">${d.cargos.map((g, i) => `<option value="${i}">${esc(g.nome)}</option>`).join("")}</select></div>
        <div><label>Número</label><input id="c_num" inputmode="numeric" maxlength="5" placeholder="10"></div>
      </div>
      <div class="row">
        <div><label>Nome</label><input id="c_nome" maxlength="50" placeholder="Nome do candidato"></div>
        <div><label>Partido</label><select id="c_partido">${d.partidos.map((p, i) => `<option value="${i}">${esc(p.sigla)} — ${esc(p.nome)}</option>`).join("")}</select></div>
      </div>
      <label>Foto (opcional)</label>
      <div class="row">
        <input id="c_foto" type="file" accept="image/*">
        <button class="auto" id="c_add">Adicionar</button>
      </div>
    </div>
    <div class="card">${porCargo}</div>
    ${navEtapas(rid, etapa)}`);
  $("#c_add").onclick = async () => {
    const numero = $("#c_num").value.trim(), nome = $("#c_nome").value.trim();
    const cargo = +$("#c_cargo").value, partido = +$("#c_partido").value;
    if (!/^\d{1,5}$/.test(numero)) return erro("Número deve ter só dígitos (até 5).");
    if (!nome) return erro("Digite o nome.");
    if (d.candidatos.some(c => c.cargo === cargo && c.numero === numero)) return erro("Já existe candidato com esse número neste cargo.");
    let foto = null;
    const arq = $("#c_foto").files[0];
    if (arq) { try { foto = await reduzirFoto(arq); } catch (e) { return erro("Não consegui ler a foto."); } }
    d.candidatos.push({ cargo, numero, nome, partido, foto });
    try { await salvarRascunho(rid, d); } catch (e) { d.candidatos.pop(); return erro("Não consegui salvar. A foto pode ser grande demais; tente outra."); }
    telaCandidatos(rid, d, etapa);
  };
  document.querySelectorAll("[data-rm-c]").forEach(b => b.onclick = async () => {
    d.candidatos.splice(+b.dataset.rmC, 1);

  ligarNav(rid, etapa, async () => {
    const falta = d.cargos.find((g, gi) => d.candidatos.filter(c => c.cargo === gi).length < 2);
    if (falta) { erro(`O cargo "${falta.nome}" precisa de pelo menos 2 candidatos.`); return false; }

/* ===================== votação ===================== */
async function carregarEleicao(id) {
  const s = await docEleicao(id).get();
  return s.exists ? normalizar(JSON.parse(JSON.stringify(s.data()))) : null;
}

/* ===================== apuração: helpers ===================== */
const timers = [];
function limparTimers() { while (timers.length) clearInterval(timers.pop()); }
function progresso(ap) {
  if (!ap) return 1;
  return Math.min(1, Math.max(0, (Date.now() - ap.inicio) / (ap.duracaoMin * 60000)));
}
function limiteMinutos(eleitores) { return Math.min(60, Math.max(1, eleitores)); }
function eleitoresDe(votos) { return new Set(votos.map(v => v.eleitor)).size; }
function cardProgresso(ap) {
  const p = progresso(ap), pct = Math.round(p * 100);
  if (p >= 1) return `<p><strong>Apuração concluída.</strong></p><div class="barra"><div style="width:100%"></div></div><p><small>Veja os campeões em "Ver resultados".</small></p>`;
  return `<p><strong>Apuração em andamento: ${pct}%</strong></p><div class="barra"><div style="width:${pct}%"></div></div><p><small>Termina às ${formatar(ap.inicio + ap.duracaoMin * 60000)}</small></p>`;
}
function fotoPequena(c) { return c.foto ? `<img class="foto" src="${c.foto}" alt="">` : `<div class="foto">?</div>`; }
function fotoGrande(c) {
  return c.foto
    ? `<img src="${c.foto}" alt="" style="width:120px;height:120px;border-radius:12px;object-fit:cover">`
    : `<div style="width:120px;height:120px;border-radius:12px;background:var(--line);display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:700">?</div>`;
}

async function votar(id) {
  let e = null;
  try { e = await carregarEleicao(id); } catch (err) {}
  if (!e) return setApp(`<div class="card"><p>Eleição não encontrada.</p><button class="sec" onclick="location.hash=''">Início</button></div>`);
  const botaoRes = e.mostrarResultados ? `<p><button class="sec" id="ver_res">Ver resultados</button></p>` : "";
  const cab = `<h1>${esc(e.titulo)}</h1>${e.descricao ? `<p>${esc(e.descricao)}</p>` : ""}`;
  if (e.apuracao && e.encerrada) {
    setApp(`${cab}<div class="card" id="apcard"></div>${botaoRes}`);
    const desenhar = () => { const el = $("#apcard"); if (!el) return false; el.innerHTML = cardProgresso(e.apuracao); return true; };
    desenhar();
    const tm = setInterval(() => { if (!desenhar() || progresso(e.apuracao) >= 1) { clearInterval(tm); } }, 1000);
    timers.push(tm);
  } else if (e.encerrada) {
    setApp(`${cab}<div class="card"><p><strong>A votação está encerrada.</strong></p></div>${botaoRes}`);
  } else {
    setApp(`${cab}<div id="fase"></div>${botaoRes}`);
    faseNome(id, e);
  }
  const vr = $("#ver_res");
  if (vr) vr.onclick = () => { location.hash = id + "-resultados"; };
}

function faseNome(id, e) {
  $("#fase").innerHTML = `
    <div class="card">
      <label>Seu nome (obrigatório, fica registrado)</label>
      <div class="row"><input id="eleitor" maxlength="50" placeholder="Digite seu nome"><button id="iniciar">Iniciar votação</button></div>
    </div>`;
  const ir = async () => {
    const nome = $("#eleitor").value.trim();
    if (!nome) return erro("Digite seu nome para votar.");
    $("#iniciar").disabled = true;
    try {
      const q = await docEleicao(id).collection("votos").limit(1000).get();
      if (q.docs.some(d => norm(d.data().eleitor) === norm(nome))) { erro("Este nome já votou nesta eleição."); $("#iniciar").disabled = false; return; }
    } catch (err) { erro("Não consegui verificar o nome. Tente de novo."); $("#iniciar").disabled = false; return; }
    faseUrna(id, e, nome);
  };
  $("#iniciar").onclick = ir;
  $("#eleitor").onkeydown = (ev) => { if (ev.key === "Enter") ir(); };
}

function faseUrna(id, e, nome) {
  const escolhas = [];
  let k = 0, digitos = "", escolha = null;
  const cargoAtual = () => e.cargos[k];
  const partidoDe = (c) => e.partidos[c.partido] || { sigla: "", nome: "" };
  const porNum = (n) => cargoAtual().candidatos.find(c => c.numero === n);

  $("#fase").innerHTML = `
    <div class="urna">
      <div id="relogio" style="text-align:center;font-family:ui-monospace,monospace;color:#000;font-size:.95rem;margin-bottom:8px"></div>
      <div class="tela" id="tela"></div>
      <div class="teclado-wrap">
        <div class="teclado">
          ${[1,2,3,4,5,6,7,8,9].map(n => `<button data-k="${n}">${n}</button>`).join("")}
          <button data-k="0" style="grid-column:2">0</button>
        </div>
        <div class="teclado" style="margin-top:8px">
          <button class="branco" data-k="branco">BRANCO</button>
          <button class="corrige" data-k="corrige">CORRIGE</button>
          <button class="confirma" data-k="confirma">CONFIRMA</button>
        </div>
      </div>
    </div>`;

  const tela = () => {
    const cab = `<div class="cargo">${esc(cargoAtual().nome)} (${k + 1}/${e.cargos.length})</div>`;
    if (escolha?.tipo === "branco") {
      $("#tela").innerHTML = `${cab}<div class="lbl">SEU VOTO SERÁ</div><div class="nome" style="margin-top:14px">VOTO EM BRANCO</div>`;
      return;
    }
    const c = escolha?.c;
    const cand = c ? `<div class="cand">${c.foto ? `<img src="${c.foto}" alt="">` : `<img alt="">`}
      <div><div class="nome">${esc(c.nome)}</div><div class="lbl">${esc(partidoDe(c).sigla)} — ${esc(partidoDe(c).nome)}</div></div></div>` : "";
    $("#tela").innerHTML = `${cab}
      <div class="lbl">NÚMERO</div>
      <div class="num">${esc(digitos) || "&nbsp;"}</div>
      ${c ? cand : `<div class="lbl" style="margin-top:12px">${digitos ? "Número inexistente neste cargo" : "Digite o número e pressione CONFIRMA"}</div>`}`;
  };

  const flash = () => { $("#tela").classList.remove("flash"); void $("#tela").offsetWidth; $("#tela").classList.add("flash"); };

  const atualizarEscolha = () => {
    const c = porNum(digitos);
    escolha = c ? { tipo: "cand", c } : null;
    tela();
  };

  const confirmarTela = () => {
    if (!escolha) { digitos = ""; tela(); flash(); return; }
    tela();
    const texto = escolha.tipo === "branco" ? "VOTO EM BRANCO" : escolha.c.nome;
    $("#tela").insertAdjacentHTML("beforeend", `
      <div style="margin-top:14px;font-size:.95rem">CONFIRMA <strong>${esc(texto)}</strong> para ${esc(cargoAtual().nome)}?</div>
      <div class="teclado" style="grid-template-columns:1fr 1fr;margin-top:8px">
        <button class="confirma" id="sim">SIM</button>
        <button class="corrige" id="nao">NÃO (CORRIGE)</button>
      </div>`);
    $("#sim").onclick = () => aceitarCargo();
    $("#nao").onclick = () => { escolha = null; digitos = ""; tela(); };
    document.querySelectorAll(".teclado button[data-k]").forEach(b => b.disabled = true);
  };

  const aceitarCargo = async () => {
    document.querySelectorAll("#tela button").forEach(b => b.disabled = true);
    try {
      await docEleicao(id).collection("votos").add({
        eleitor: nome, cargo: cargoAtual().nome,
        voto: escolha.tipo === "branco" ? "branco" : escolha.c.numero, hora: Date.now(),
      });
    } catch (err) {
      erro("Não consegui registrar o voto. Tente de novo.");
      confirmarTela();
      return;
    }
    const ultimo = k === e.cargos.length - 1;
    if (!ultimo) await tocarAudio(SOM_CANDIDATO);
    k++;
    if (k < e.cargos.length) {
      digitos = ""; escolha = null;
      document.querySelectorAll(".teclado button[data-k]").forEach(b => b.disabled = false);
      tela(); return;
    }
    $("#tela").innerHTML = `<div class="nome" style="margin-top:30px;text-align:center">VOTO REGISTRADO</div>
      <div class="lbl" style="text-align:center;margin-top:10px">Obrigado, ${esc(nome)}!</div>`;
    await tocarAudio(SOM_FIM);
    setTimeout(() => faseNome(id, e), 1500);
  };

  document.querySelectorAll(".teclado button[data-k]").forEach(b => b.onclick = () => {
    const kk = b.dataset.k;
    if (kk === "sair") return faseNome(id, e);
    if (kk === "corrige") { digitos = ""; escolha = null; return tela(); }
    if (kk === "branco") { digitos = ""; escolha = { tipo: "branco" }; return tela(); }
    if (kk === "confirma") { if (!escolha) { flash(); erro("Número inexistente neste cargo."); return; } return confirmarTela(); }
    if (digitos.length >= 5) return;
    digitos += kk;
    atualizarEscolha();
  });
  tela();
  const atualizaRelogio = () => {
    const el = $("#relogio");
    if (!el) return false;
    el.textContent = new Date().toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false });
    return true;
  };
  atualizaRelogio();
  const tr = setInterval(() => { if (!atualizaRelogio()) clearInterval(tr); }, 1000);
  timers.push(tr);
}

/* ===================== resultados ===================== */
async function resultados(id, forcar) {
  let e = null;
  try { e = await carregarEleicao(id); } catch (err) {}
  if (!e) return setApp(`<div class="card"><p>Eleição não encontrada.</p></div>`);
  setApp(`<h1>Resultados: ${esc(e.titulo)}</h1><div id="res"><p>Carregando…</p></div>
    <p><button class="sec" id="voltar">Voltar para votação</button></p>`);
  $("#voltar").onclick = () => { location.hash = id; };
  if (!forcar && !e.mostrarResultados) {
    $("#res").innerHTML = `<div class="card"><p>Os resultados ainda não foram liberados pelo criador da eleição.</p></div>`;
    return;
  }
  let votos = [];
  try { const q = await docEleicao(id).collection("votos").limit(1000).get(); votos = q.docs.map(d => d.data()); } catch (err) {}
  votos.sort((a, b) => a.hora - b.hora);
  const ap = e.apuracao || null;
  let cerimoniaFeita = false, idx = 0, timer = null;
  const nomeCargo = (v) => v.cargo || e.cargos[0].nome;
  const contar = (lista, nomeG) => {
    const c = {};
    lista.filter(v => nomeCargo(v) === nomeG).forEach(v => { c[v.voto] = (c[v.voto] || 0) + 1; });
    return c;
  };

  const blocos = (lista) => e.cargos.map(g => {
    const cont = contar(lista, g.nome);
    const total = Object.values(cont).reduce((a, b) => a + b, 0);
    const pct = (n) => total ? Math.round((n / total) * 100) : 0;
    const linhas = g.candidatos.map(c => ({ c, n: cont[c.numero] || 0 })).sort((a, b) => b.n - a.n);
    return `<div class="card">
      <h2>${esc(g.nome)} <small>(${total} voto(s))</small></h2>
      <ul class="lista">
        ${linhas.map(({ c, n }) => `<li>${fotoPequena(c)}
          <div style="flex:1"><strong>${esc(c.nome)}</strong> <small>${esc(e.partidos[c.partido]?.sigla || "")} · nº ${esc(c.numero)}</small>
          <div class="barra"><div style="width:${pct(n)}%"></div></div></div><strong>${n}</strong></li>`).join("")}
        <li><div class="foto">B</div><span style="flex:1">Em branco</span><strong>${cont["branco"] || 0}</strong></li>
      </ul></div>`;
  }).join("");

  const quemVotou = () => {
    const linhas = votos.map(v => {
      const g = e.cargos.find(x => x.nome === nomeCargo(v));
      const c = g?.candidatos.find(x => x.numero === v.voto);
      const destino = v.voto === "branco" ? "em branco" : (c ? c.nome : "nº " + v.voto);
      return `<li><span style="flex:1">${esc(v.eleitor)} <small>(${esc(nomeCargo(v))})</small></span><small>${esc(destino)}</small></li>`;
    }).join("");
    return `<div class="card"><h2>Quem votou e em quem <small>(só o criador vê)</small></h2>
      <ul class="lista">${linhas || "<li><small>Ninguém votou ainda.</small></li>"}</ul></div>`;
  };

  const campeoes = () => e.cargos.map(g => {
    const cont = contar(votos, g.nome);
    const max = Math.max(0, ...Object.values(cont));
    const vencedores = max > 0 ? g.candidatos.filter(c => cont[c.numero] === max) : [];
    return { cargo: g.nome, votos: max, vencedores };
  });

  const avancar = () => { idx++; if (idx >= e.cargos.length) cerimoniaFeita = true; render(); };
  const pularCerimonia = () => { cerimoniaFeita = true; render(); };

  const ceremonia = () => {
    const lista = campeoes(), N = lista.length, s = lista[idx];
    const restantes = N - idx - 1;
    const corpo = s.vencedores.length
      ? s.vencedores.map(c => `<div style="text-align:center;margin:6px">
          <button class="foto-btn" data-adv="1" title="Próximo campeão">${fotoGrande(c)}</button>
          <p style="margin:6px 0"><strong>nº ${esc(c.numero)}</strong><br>${esc(c.nome)}<br>
          <small>${esc(e.partidos[c.partido]?.sigla || "")} — ${esc(e.partidos[c.partido]?.nome || "")}</small><br>
          <small>${s.votos} voto(s)</small></p></div>`).join("")
      : `<p>Nenhum voto neste cargo.</p>`;
    return `<div class="card" style="text-align:center">
      <h2>Campeão de ${esc(s.cargo)} <small>(${idx + 1}/${N})</small></h2>
      ${s.vencedores.length > 1 ? `<p><small>Empate entre ${s.vencedores.length} candidatos.</small></p>` : ""}
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">${corpo}</div>
      <p><small>Observação: clique na foto do campeão para ir ao próximo. ${restantes > 0 ? `Faltam ${restantes} campeão(ões).` : "Este é o último campeão."}</small></p>
      <button id="proximo_cer">Próximo campeão →</button>
      <button class="sec" id="pular_cer" style="margin-left:6px">Pular para resultados completos</button>
    </div>`;
  };

  const render = () => {
    const el = $("#res");
    if (!el) { if (timer) clearInterval(timer); return; }
    const p = ap ? progresso(ap) : 1;
    let html = "";
    if (ap) html += `<div class="card">${cardProgresso(ap)}</div>`;
    if (ap && p < 1 && !forcar) {
      const n = Math.floor(votos.length * p);
      html += `<p><small>Mostrando ${n} de ${votos.length} voto(s) já apurados.</small></p>` + blocos(votos.slice(0, n));
    } else if (ap && p >= 1 && !forcar && !cerimoniaFeita) {
      html += ceremonia();
    } else {
      html += blocos(votos);
      if (forcar) html += quemVotou();
    }
    el.innerHTML = html;
    document.querySelectorAll("[data-adv]").forEach(b => b.onclick = avancar);
    const pc = $("#proximo_cer"); if (pc) pc.onclick = avancar;
    const pu = $("#pular_cer"); if (pu) pu.onclick = pularCerimonia;
    if (timer && p >= 1) { clearInterval(timer); timer = null; }
  };

  render();
  if (ap && progresso(ap) < 1) {
    timer = setInterval(render, 1000);
    timers.push(timer);
  }
}

async function painelAdmin(id, segredo) {
  let e = null;
  try { e = await carregarEleicao(id); } catch (err) {}
  if (!e) return setApp(`<div class="card"><p>Eleição não encontrada.</p></div>`);
  if (!segredo || (await sha256(segredo)) !== e.segredoHash) return setApp(`<div class="card"><p>Link de gerenciamento inválido.</p></div>`);
  let votos = [];
  try { const q = await docEleicao(id).collection("votos").limit(1000).get(); votos = q.docs.map(d => d.data()); } catch (err) {}
  const eleitores = eleitoresDe(votos);
  const max = limiteMinutos(eleitores), sugerido = Math.min(10, max);
  const ap = e.apuracao || null;
  let estado;
  if (!e.encerrada) {
    estado = `<p><strong>Status:</strong> votação aberta. ${eleitores} eleitor(es) votaram até agora.</p>
      <div class="row" style="margin-top:8px">
        <div><label>Tempo da apuração (minutos)</label><input id="min_ap" type="number" min="1" max="${max}" value="${sugerido}"></div>
        <button id="btn_enc" class="auto">Encerrar votação e iniciar apuração</button>
      </div>
      <p><small>Limite: até ${max} min. A regra é 1 minuto por eleitor, com no máximo 60 min.</small></p>`;
  } else if (ap && progresso(ap) < 1) {
    estado = `<p><strong>Apuração em andamento:</strong> ${Math.round(progresso(ap) * 100)}%</p>
      <p><small>Termina às ${formatar(ap.inicio + ap.duracaoMin * 60000)}</small></p>`;
  } else if (ap) {
    estado = `<p><strong>Apuração concluída.</strong></p>`;
  } else {
    estado = `<p><strong>Votação encerrada.</strong></p>`;
  }
  const base = urlBase();
  setApp(`
    <h1>Painel: ${esc(e.titulo)}</h1>
    <div class="card">
      ${estado}
      <p><small>Criada em ${formatar(e.criadaEm)}</small></p>
    </div>
    <div class="card">
      <p><strong>Link de votação:</strong></p><div class="link">${esc(base + "#" + id)}</div>
      <p><strong>Link de resultados:</strong></p><div class="link">${esc(base + "#" + id + "-resultados")}</div>
    </div>
    <div class="card">
      <button class="sec" id="toggle_res">${e.mostrarResultados ? "Ocultar resultados dos eleitores" : "Mostrar resultados aos eleitores"}</button>
      <button class="sec" id="ver_admin_res" style="margin-left:6px">Ver resultados agora</button>
    </div>
    <p><small>Este link de gerenciamento é secreto. Não compartilhe com os eleitores.</small></p>`);
  const bEnc = $("#btn_enc");
  if (bEnc) bEnc.onclick = async () => {
    const m = parseInt($("#min_ap").value, 10);
    if (!(m >= 1 && m <= max)) return erro(`Escolha entre 1 e ${max} minutos.`);
    try {
      await docEleicao(id).update({
        encerrada: true, mostrarResultados: true,
        apuracao: { inicio: Date.now(), duracaoMin: m, totalVotos: votos.length },
      });
      painelAdmin(id, segredo);
    } catch (err) { erro("Não consegui iniciar a apuração."); }
  };
  $("#toggle_res").onclick = async () => {
    try { await docEleicao(id).update({ mostrarResultados: !e.mostrarResultados }); painelAdmin(id, segredo); }
    catch (err) { erro("Não consegui atualizar os resultados."); }
  };
  $("#ver_admin_res").onclick = () => resultados(id, true);
}

function rota() {
  limparTimers();
  if (!db) return home();
  const h = decodeURIComponent(location.hash.slice(1)).trim();
  if (!h) return home();
  if (h === "criar") return novoRascunho();
  if (h.startsWith("novo-")) {
    const [, rid, etapa] = h.split("-");
    return etapaCriacao(rid, etapa || "info");
  }
  if (h.startsWith("gerenciar-")) {
    const [, id, segredo] = h.split("-");
    return painelAdmin(id, segredo || "");
  }
  if (h.endsWith("-resultados")) return resultados(h.slice(0, -"-resultados".length), false);
  return votar(h);
}
window.addEventListener("hashchange", rota);
(async () => { await initDb(); rota(); })();
